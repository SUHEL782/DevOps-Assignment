name: DevOps Assignment CI/CD

on:
  push:
    branches:
      - develop
      - main

env:
  AWS_REGION: us-east-1
  GCP_REGION: europe-north1
  BACKEND_IMAGE: backend
  FRONTEND_IMAGE: frontend

jobs:
  build-test-push:
    name: Build, Test & Push Images
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------- BACKEND TESTS ----------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          cd backend
          pytest || echo "No tests found, continuing"

      # ---------------- FRONTEND TESTS ----------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Run frontend tests
        run: |
          cd frontend
          npm test -- --watch=false || echo "No tests found, continuing"

      # ---------------- AWS LOGIN ----------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------- GCP LOGIN ----------------
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # ---------------- BUILD & PUSH BACKEND ----------------
      - name: Build & Push Backend Image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t backend backend
          
          docker tag backend \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/backend:$IMAGE_TAG
          
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/backend:$IMAGE_TAG
          
          docker tag backend \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/devops-assignment/backend:$IMAGE_TAG
          
          docker push \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/devops-assignment/backend:$IMAGE_TAG

      # ---------------- BUILD & PUSH FRONTEND ----------------
      - name: Build & Push Frontend Image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t frontend frontend
          
          docker tag frontend \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/frontend:$IMAGE_TAG
          
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/frontend:$IMAGE_TAG
          
          docker tag frontend \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/devops-assignment/frontend:$IMAGE_TAG
          
          docker push \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/devops-assignment/frontend:$IMAGE_TAG

  deploy:
    name: Deploy to AWS & GCP
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-test-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- AWS ----------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------- GCP ----------
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ---------- TERRAFORM ----------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply AWS
        run: |
          cd terraform/aws
          terraform init
          terraform apply -auto-approve

      - name: Terraform Apply GCP
        run: |
          cd terraform/gcp
          terraform init
          terraform apply -auto-approve

