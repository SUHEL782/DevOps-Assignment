name: DevOps Assignment CI/CD

on:
  push:
    branches:
      - develop
      - main

env:
  # ---------- AWS ----------
  AWS_REGION: eu-north-1
  AWS_ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-north-1.amazonaws.com
  BACKEND_IMAGE: devops-backend
  FRONTEND_IMAGE: devops-frontend

  # ---------- GCP ----------
  GCP_REGION: europe-north1
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REPOSITORY: devops-assignment

# =========================================================
# BUILD, TEST & PUSH (develop)
# =========================================================
jobs:
  build-test-push:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- BACKEND TEST ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Backend tests
        run: |
          cd backend
          pip install -r requirements.txt
          pytest || echo "No backend tests"

      # ---------- FRONTEND TEST ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Frontend tests
        run: |
          cd frontend
          npm install
          npm test -- --watch=false || echo "No frontend tests"

      # ---------- AWS AUTH ----------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ---------- GCP AUTH ----------
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker $GCP_REGION-docker.pkg.dev --quiet

      # ---------- BUILD & PUSH ----------
      - name: Build & Push Images
        run: |
          IMAGE_TAG=${{ github.sha }}

          # ===== BACKEND =====
          docker build -t backend backend

          docker tag backend \
            $AWS_ECR_REGISTRY/$BACKEND_IMAGE:$IMAGE_TAG
          docker push \
            $AWS_ECR_REGISTRY/$BACKEND_IMAGE:$IMAGE_TAG

          docker tag backend \
            $GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_REPOSITORY/$BACKEND_IMAGE:$IMAGE_TAG
          docker push \
            $GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_REPOSITORY/$BACKEND_IMAGE:$IMAGE_TAG

          # ===== FRONTEND =====
          docker build -t frontend frontend

          docker tag frontend \
            $AWS_ECR_REGISTRY/$FRONTEND_IMAGE:$IMAGE_TAG
          docker push \
            $AWS_ECR_REGISTRY/$FRONTEND_IMAGE:$IMAGE_TAG

          docker tag frontend \
            $GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_REPOSITORY/$FRONTEND_IMAGE:$IMAGE_TAG
          docker push \
            $GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_REPOSITORY/$FRONTEND_IMAGE:$IMAGE_TAG

# =========================================================
# DEPLOY (main)
# =========================================================
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- AWS ----------
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------- GCP ----------
      - name: Authenticate GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ---------- TERRAFORM ----------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Deploy AWS (ECS)
        run: |
          cd terraform/aws
          terraform init -input=false
          terraform apply -auto-approve \
            -var="image_tag=${{ github.sha }}"

      - name: Deploy GCP (Cloud Run)
        run: |
          cd terraform/gcp
          terraform init -input=false
          terraform apply -auto-approve \
            -var="image_tag=${{ github.sha }}"
