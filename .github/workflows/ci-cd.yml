name: DevOps Assignment CI/CD

on:
  push:
    branches: [develop, main]

env:
  AWS_REGION: us-east-1
  GCP_REGION: europe-north1
  BACKEND_IMAGE: backend
  FRONTEND_IMAGE: frontend

jobs:
  build-test-push:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ---------- BACKEND TESTS ----------
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: |
          cd backend
          pip install -r requirements.txt
          pytest || echo "No tests found"

      # ---------- FRONTEND TESTS ----------
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - run: |
          cd frontend
          npm install
          npm test -- --watch=false || echo "No tests found"

      # ---------- AWS ----------
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # ---------- GCP ----------
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # ---------- BUILD & PUSH ----------
      - name: Build & Push Images
        run: |
          IMAGE_TAG=${{ github.sha }}

          docker build -t $BACKEND_IMAGE backend
          docker tag $BACKEND_IMAGE \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$BACKEND_IMAGE:$IMAGE_TAG
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$BACKEND_IMAGE:$IMAGE_TAG

          docker tag $BACKEND_IMAGE \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/devops-assignment/$BACKEND_IMAGE:$IMAGE_TAG
          docker push \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/devops-assignment/$BACKEND_IMAGE:$IMAGE_TAG
